<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alimenta Campus — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand-deep: #06402b;
      --brand-tint: #ecf3f1;
    }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: var(--brand-deep);
    }
    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .page .overlay {
      position: absolute; inset: 0;
      background: rgba(6, 64, 43, 0.82);
    }
    .content {
      position: relative;
      width: 100%; max-width: 1280px;
      display: flex; flex-direction: column;
      align-items: center; gap: 40px;
      padding: 40px 20px;
    }
    .logo {
      width: 240px; flex-shrink: 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
    }
    .card {
      width: 100%; max-width: 430px;
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px rgba(0,0,0,.35);
    }
    .card h1 {
      font-size: 28px; font-weight: 800;
      color: var(--brand-deep); line-height: 1.2;
    }
    .card .sub {
      margin-top: 4px; font-size: 16px;
      color: var(--brand-deep);
    }
    form { margin-top: 28px; }
    label.field {
      display: block; font-size: 14px; font-weight: 700;
      color: var(--brand-deep);
    }
    label.field + .input-box { margin-top: 8px; }
    .input-box {
      display: flex; align-items: center;
      height: 56px;
      border: 1px solid rgba(6,64,43,.25);
      border-radius: 12px;
      background: #fff;
      padding: 0 16px;
    }
    .input-box:focus-within {
      border-color: var(--brand-deep);
      box-shadow: 0 0 0 2px rgba(6,64,43,.15);
    }
    .input-box img { width: 25px; height: 25px; flex-shrink: 0; }
    .input-box input {
      height: 100%; flex: 1; min-width: 0;
      border: none; outline: none; background: transparent;
      padding: 0 12px;
      font: inherit; font-size: 15px;
      color: var(--brand-deep);
    }
    .input-box input::placeholder { color: rgba(6,64,43,.5); }
    .eye-btn {
      background: none; border: none; cursor: pointer;
      padding: 0; flex-shrink: 0;
    }
    .eye-btn:hover { opacity: .7; }
    .row {
      margin-top: 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; font-size: 13px;
    }
    .remember {
      display: flex; align-items: center; gap: 8px;
      color: var(--brand-deep); cursor: pointer;
    }
    .remember input {
      width: 22px; height: 22px; cursor: pointer; flex-shrink: 0;
    }
    .forgot {
      font-weight: 700; color: var(--brand-deep);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; text-underline-offset: 2px; }
    .btn-entrar {
      margin-top: 24px;
      width: 100%; height: 58px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: var(--brand-deep); color: #fff;
      border: none; border-radius: 12px;
      font: inherit; font-size: 17px; font-weight: 800;
      cursor: pointer;
    }
    .btn-entrar:hover { background: rgba(6,64,43,.9); }
    .btn-entrar img { width: 35px; height: 35px; }
    .divider {
      margin-top: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(6,64,43,.2);
    }
    .divider span { font-size: 14px; color: var(--brand-deep); }
    .btn-udesc {
      margin-top: 24px;
      width: 100%; min-height: 72px;
      display: flex; align-items: center; gap: 16px;
      background: var(--brand-tint);
      border: none; border-radius: 12px;
      padding: 12px 20px;
      font: inherit; text-align: left; cursor: pointer;
    }
    .btn-udesc:hover { background: rgba(236,243,241,.7); }
    .btn-udesc .udesc-logo { width: 65px; height: 51px; object-fit: contain; flex-shrink: 0; }
    .btn-udesc .texto { flex: 1; }
    .btn-udesc .titulo {
      display: block; font-size: 16px; font-weight: 700;
      color: var(--brand-deep); line-height: 1.3;
    }
    .btn-udesc .desc {
      display: block; margin-top: 2px;
      font-size: 10px; line-height: 1.2;
      color: rgba(6,64,43,.7);
    }
    .btn-udesc .seta { width: 25px; height: 25px; flex-shrink: 0; transition: transform .2s; }
    .btn-udesc:hover .seta { transform: translateX(4px); }

    @media (min-width: 640px) {
      .logo { width: 320px; }
      .card { padding: 40px; }
    }
    @media (min-width: 1024px) {
      .content {
        flex-direction: row; justify-content: space-between;
        gap: 64px; padding: 48px 96px;
      }
      .logo { width: 430px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="bg" src="img/background.png" alt="" />
    <div class="overlay"></div>

    <div class="content">
      <img class="logo" src="img/logo-alimenta-campus.png" alt="Alimenta Campus — UDESC" />

      <main class="card">
        <h1>Bem-Vindo(a)!</h1>
        <p class="sub">Faça o login para continuar</p>

        <form action="#">
          <label class="field" for="usuario">Usuário</label>
          <div class="input-box">
            <img src="img/icon-user.png" alt="" />
            <input id="usuario" name="usuario" type="text" placeholder="Digite seu usuário" />
          </div>

          <label class="field" for="senha" style="margin-top:20px">Senha</label>
          <div class="input-box">
            <img src="img/icon-lock.png" alt="" />
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />
            <button type="button" class="eye-btn" aria-label="Mostrar senha">
              <img src="img/icon-eye.png" alt="" />
            </button>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" name="lembrar" />
              <span>Lembrar de mim</span>
            </label>
            <a href="#" class="forgot">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn-entrar">
            <img src="img/icon-login.png" alt="" />
            Entrar
          </button>
        </form>

        <div class="divider"><span>ou</span></div>

        <button type="button" class="btn-udesc">
          <img class="udesc-logo" src="img/logo-udesc-colorida.png" alt="UDESC" />
          <span class="texto">
            <span class="titulo">Entrar com ID UDESC</span>
            <span class="desc">Será redirecionado(a) para o site ID UDESC.</span>
          </span>
          <img class="seta" src="img/icon-arrow.png" alt="" />
        </button>
      </main>
    </div>
  </div>
</body>
</html>
